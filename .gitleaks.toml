title = "ShopNest gitleaks configuration"

# Start from the default ruleset (AWS keys, private keys, tokens, etc.)
[extend]
useDefault = true

# Part D forbids server addresses anywhere in the repo or history.
[[rules]]
id = "shopnest-ipv4-address"
description = "IPv4 address (server addresses must not be committed)"
regex = '''\b(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\b'''
tags = ["network", "shopnest"]

[rules.allowlist]
description = "Loopback / wildcard bind addresses are not server addresses"
regexes = ['''^(?:0\.0\.0\.0|127\.0\.0\.1)$''']

[[rules]]
id = "shopnest-ec2-hostname"
description = "AWS EC2 public DNS name (server hostnames must not be committed)"
regex = '''ec2-(?:[0-9]{1,3}-){3}[0-9]{1,3}\.[a-z0-9.-]*amazonaws\.com'''
tags = ["network", "shopnest"]

# Lockfiles contain long hashes and dotted versions, not server addresses.
[[allowlists]]
description = "Dependency lockfiles"
paths = ['''package-lock\.json$''', '''\.terraform\.lock\.hcl$''']
