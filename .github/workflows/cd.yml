            if aws ec2 revoke-security-group-ingress --group-id "$SSH_SG_ID" --security-group-rule-ids "$rule_id"; then
              echo "rule_id=" >> "$GITHUB_OUTPUT"
            fi
            fail "SSH group failed verification; the rule was revoked"
          fi
          echo "Opened tcp/22 for one runner address (rule ${rule_id}), expires in 15 minutes."
      - name: Prepare SSH (pinned host key, no ssh-keyscan)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Upload the release and run the blue/green deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
