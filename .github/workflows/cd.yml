name: CD

# Continuous delivery to the LAB instance (infra/lab): runs only after the CI workflow has SUCCEEDED for a push to main.
# Design: infra/lab/README.md and docs/LAB_DEPLOYMENT.md.
#
#   gate               confirm CI succeeded for the exact commit, and that it is still the tip of main
#   publish-images     build the backend and frontend images for that commit, push both to GHCR tagged with the commit SHA, read
#                      back their DIGESTS, and prove the packages can be pulled anonymously (the host has no registry credential)
#   deploy-staging     Environment `staging`: SSH to the instance through an AWS Systems Manager port-forwarding tunnel (the instance
#                      has no inbound port 22) as an unprivileged user that can only start a root-owned wrapper, which fetches the
#                      commit, pulls both images by digest, runs the migrations and does the blue/green deploy with automatic rollback
#   deploy-production  Environment `production`: the SAME steps for production, after staging deployed. GitHub holds this job until a
#                      required reviewer approves it (configured in the Environment's protection rules, see docs/GITHUB_SETUP.md)
#
# No AWS credential is stored. The images are pushed with the run's own short-lived GITHUB_TOKEN, and a deploy job exchanges its
# short-lived GitHub OIDC token for its Environment's role (which can only open a port-forwarding session to the lab instance). The ONE
# secret is each Environment's own SSH private key (staging and production use different keys; on the host each key is bound to its
# environment). Settings read from each Environment (set separately, with approval):
#   secret    DEPLOY_SSH_KEY
#   variables AWS_ROLE_ARN, AWS_REGION, LAB_INSTANCE_ID, SSH_HOST_KEY (the instance's PUBLIC host key, pinned: no StrictHostKeyChecking=no)
#
# STATUS: written and tested offline only; it has NEVER run against AWS. Nothing here runs until the repository variable CD_ENABLED is
# set to "true" (a deliberate, separate step), so merging this file cannot start a deployment. Manual rollback is rollback.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# No default token permissions: every job declares exactly what it needs.
permissions: {}

jobs:
  gate:
    name: Verify CI result and select release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - name: Select the exact commit CI validated
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::CI commit is not a full SHA"; exit 1; }
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          deploy=true
          if [ "$tip" != "$CI_SHA" ]; then
            deploy=false
            echo "::notice::Skipping: main has moved on since this CI run, so it is not the latest commit."
          fi
          echo "sha=${CI_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release selection"
            echo "- Commit: \`${CI_SHA}\`"
            echo "- CI run: ${CI_RUN_URL}"
            echo "- Deploy: ${deploy}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    name: Build and publish images (GHCR)
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
    outputs:
      backend_ref: ${{ steps.publish.outputs.backend_ref }}
      frontend_ref: ${{ steps.publish.outputs.frontend_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Sign in to GHCR with the run's own token (no stored credential)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build both images for this exact commit, push them, and read back their digests
        id: publish
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for kind in backend frontend; do
            image="ghcr.io/${owner}/shopnest-${kind}"
            docker build \
              --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --tag "${image}:${RELEASE_SHA}" "$kind"
            docker push "${image}:${RELEASE_SHA}"
            ref="$(docker image inspect "${image}:${RELEASE_SHA}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${image}@sha256:" | head -n 1)"
            [[ "$ref" =~ ^ghcr\.io/[a-z0-9][a-z0-9-]*/shopnest-(backend|frontend)@sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest was reported for the ${kind} image"; exit 1; }
            echo "${kind}_ref=${ref}" >> "$GITHUB_OUTPUT"
          done
      # The instance pulls with no credential. A package GitHub created private (the first push does that) must be made Public once,
      # by the repository owner, in the package settings. Fail HERE, clearly, rather than on the instance.
      - name: Check that both packages can be pulled anonymously
        env:
          BACKEND_REF: ${{ steps.publish.outputs.backend_ref }}
          FRONTEND_REF: ${{ steps.publish.outputs.frontend_ref }}
        run: |
          set -euo pipefail
          for ref in "$BACKEND_REF" "$FRONTEND_REF"; do
            repo="${ref#ghcr.io/}"
            repo="${repo%@*}"
            digest="${ref#*@}"
            token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | jq -r .token)"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${repo}/manifests/${digest}")"
            if [ "$code" != "200" ]; then
              echo "::error::${repo} cannot be pulled anonymously (HTTP ${code}). Make the package Public in its GitHub package settings (one time), then re-run this workflow."
              exit 1
            fi
          done
          {
            echo "### Images (GHCR, by digest)"
            echo "- Release: \`${RELEASE_SHA}\`"
            echo "- Backend: \`${BACKEND_REF}\`"
            echo "- Frontend: \`${FRONTEND_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging
    needs: [gate, publish-images]
    runs-on: ubuntu-latest
    # The deploy script is bounded on the host; this is the ceiling for the whole job.
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      # One lab instance: deploys and rollbacks, staging and production, never overlap.
      group: deploy-lab
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      BACKEND_REF: ${{ needs.publish-images.outputs.backend_ref }}
      FRONTEND_REF: ${{ needs.publish-images.outputs.frontend_ref }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAB_INSTANCE_ID: ${{ vars.LAB_INSTANCE_ID }}
      SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Check the settings before touching AWS
        run: |
          set -euo pipefail
          for name in AWS_REGION LAB_INSTANCE_ID SSH_HOST_KEY BACKEND_REF FRONTEND_REF; do
            [ -n "${!name}" ] || { echo "::error::$name is not set (a staging Environment variable, or the publish job's output)"; exit 1; }
          done
      # Installed BEFORE the AWS credentials exist: the package is only a checksum-verified download, and it never runs with them.
      - name: Install the Session Manager plugin (pinned version, checksum verified)
        run: bash deploy/ci/install-ssm-plugin.sh
      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Deploy on the instance (SSH through an SSM tunnel)
        id: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -uo pipefail
          rc=0
          bash deploy/ci/ssh-deploy.sh deploy --environment staging --instance "$LAB_INSTANCE_ID" --region "$AWS_REGION" \
            --sha "$RELEASE_SHA" --image-ref "$BACKEND_REF" --frontend-ref "$FRONTEND_REF" --seed \
            --log-file deploy-log.txt || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            1) echo "::error::The deploy failed; the previous release is still serving (exit 1)." ;;
            3) echo "::error::CRITICAL: the deploy failed AND the automatic rollback failed (exit 3). The environment may be serving a release that did not verify." ;;
            *) echo "::error::The deploy result could not be confirmed (exit $rc). Treat it as failed and check the instance." ;;
          esac
          exit "$rc"
      - name: Make sure no tunnel is left behind
        if: always()
        run: pkill -f AWS-StartPortForwardingSession || true
      - name: Upload the deployment log
        if: always() && hashFiles('deploy-log.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-log-staging-${{ needs.gate.outputs.sha }}
          path: deploy-log.txt
          retention-days: 30
      - name: Summary
        if: always()
        env:
          EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        run: |
          {
            echo "### Staging deploy"
            echo "- Release: \`${RELEASE_SHA}\`"
            echo "- Backend image (by digest): \`${BACKEND_REF}\`"
            echo "- Frontend image (by digest): \`${FRONTEND_REF}\`"
            echo "- Result code: \`${EXIT_CODE:-not reached}\` (0 deployed; 1 failed, previous release serving; 3 failed and recovery failed; 4 unconfirmed)"
          } >> "$GITHUB_STEP_SUMMARY"

  # PRODUCTION. Bound to the `production` GitHub Environment: GitHub pauses this job until a required reviewer approves it (the protection
  # rules are configured in GitHub settings, not here). WARNING: GitHub creates a missing Environment on first use WITHOUT any protection
  # rule, and then this job would run at once: keep `production` configured with its required reviewer BEFORE setting CD_ENABLED.
  # It runs only after staging deployed successfully (which also means CD_ENABLED, a successful CI run and the latest commit were
  # confirmed by `gate`). Its AWS role trusts only the production Environment's subject and can only open a port-forwarding session
  # to the lab instance; its SSH key differs from staging's and, on the host, that key is bound to production.
  deploy-production:
    name: Deploy to production (requires approval)
    needs: [gate, publish-images, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-lab
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      BACKEND_REF: ${{ needs.publish-images.outputs.backend_ref }}
      FRONTEND_REF: ${{ needs.publish-images.outputs.frontend_ref }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAB_INSTANCE_ID: ${{ vars.LAB_INSTANCE_ID }}
      SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Check the settings before touching AWS
        run: |
          set -euo pipefail
          for name in AWS_REGION LAB_INSTANCE_ID SSH_HOST_KEY BACKEND_REF FRONTEND_REF; do
            [ -n "${!name}" ] || { echo "::error::$name is not set (a production Environment variable, or the publish job's output)"; exit 1; }
          done
      # Installed BEFORE the AWS credentials exist: the package is only a checksum-verified download, and it never runs with them.
      - name: Install the Session Manager plugin (pinned version, checksum verified)
        run: bash deploy/ci/install-ssm-plugin.sh
      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      # The production catalogue is never seeded by a deploy (no --seed): loading demo data into production is an explicit operator
      # choice (docs/LAB_DEPLOYMENT.md).
      - name: Deploy on the instance (SSH through an SSM tunnel)
        id: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -uo pipefail
          rc=0
          bash deploy/ci/ssh-deploy.sh deploy --environment production --instance "$LAB_INSTANCE_ID" --region "$AWS_REGION" \
            --sha "$RELEASE_SHA" --image-ref "$BACKEND_REF" --frontend-ref "$FRONTEND_REF" \
            --log-file deploy-log.txt || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            1) echo "::error::The deploy failed; the previous release is still serving (exit 1)." ;;
            3) echo "::error::CRITICAL: the deploy failed AND the automatic rollback failed (exit 3). Production may be serving a release that did not verify." ;;
            *) echo "::error::The deploy result could not be confirmed (exit $rc). Treat it as failed and check the instance." ;;
          esac
          exit "$rc"
      - name: Make sure no tunnel is left behind
        if: always()
        run: pkill -f AWS-StartPortForwardingSession || true
      - name: Upload the deployment log
        if: always() && hashFiles('deploy-log.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-log-production-${{ needs.gate.outputs.sha }}
          path: deploy-log.txt
          retention-days: 30
      - name: Summary
        if: always()
        env:
          EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        run: |
          {
            echo "### Production deploy"
            echo "- Release: \`${RELEASE_SHA}\` (deployed to staging first; approved by the production Environment's reviewer)"
            echo "- Backend image (by digest): \`${BACKEND_REF}\`"
            echo "- Frontend image (by digest): \`${FRONTEND_REF}\`"
            echo "- Result code: \`${EXIT_CODE:-not reached}\` (0 deployed; 1 failed, previous release serving; 3 failed and recovery failed; 4 unconfirmed)"
          } >> "$GITHUB_STEP_SUMMARY"
