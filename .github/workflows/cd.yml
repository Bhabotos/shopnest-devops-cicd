  report:
    name: Deployment status
    needs: [gate, package, deploy-staging, deploy-production]
    if: always() && needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarise the release
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          GATE: ${{ needs.gate.result }}
          PACKAGE: ${{ needs.package.result }}
          STAGING: ${{ needs.deploy-staging.result }}
          PRODUCTION: ${{ needs.deploy-production.result }}
        run: |
          {
            echo "### Deployment status for \`${RELEASE_SHA}\`"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| CI gate | ${GATE} |"
            echo "| Package | ${PACKAGE} |"
            echo "| Staging | ${STAGING} |"
            echo "| Production | ${PRODUCTION} |"
          } >> "$GITHUB_STEP_SUMMARY"
