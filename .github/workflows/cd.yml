name: CD

# Continuous delivery: runs only after the CI workflow has SUCCEEDED for a push to main.
# Staging deploys first; production waits for the manual approval on the `production`
# GitHub Environment. Design: docs/ARCHITECTURE.md and docs/OIDC_DESIGN.md.
#
# STATUS: written and rehearsed locally only (blue/green deploy and rollback scripts, offline tests,
# a local Docker Desktop rehearsal); it has never run against AWS. Nothing here runs until the
# repository variable CD_ENABLED is set to "true" (a deliberate, separate step), so merging this
# file cannot start a deployment. Manual rollback is the separate rollback.yml workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# No default token permissions: every job declares exactly what it needs.
permissions: {}

jobs:
  gate:
    name: Verify CI result and select release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - name: Select the exact commit CI validated
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::CI commit is not a full SHA"; exit 1; }
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          deploy=true
          if [ "$tip" != "$CI_SHA" ]; then
            deploy=false
            echo "::notice::Skipping: main has moved on since this CI run, so it is not the latest commit."
          fi
          echo "sha=${CI_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release selection"
            echo "- Commit: \`${CI_SHA}\`"
            echo "- CI run: ${CI_RUN_URL}"
            echo "- Deploy: ${deploy}"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package release
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Download the frontend build produced by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-node24
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release/frontend-dist
      - name: Build the backend image for this exact commit
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --tag "shopnest-backend:${RELEASE_SHA}" backend
          mkdir -p release
          docker save "shopnest-backend:${RELEASE_SHA}" | gzip -9 > release/backend-image.tar.gz
      - name: Assemble the release bundle
        run: |
          set -euo pipefail
          # An explicit list: the server gets only what the deploy scripts use, never the tests, the
          # development or test Compose files or the .env example.
          mkdir -p release/deploy/scripts/lib release/deploy/env release/deploy/nginx release/deploy/db
          cp deploy/docker-compose.prod.yml release/deploy/
          cp deploy/scripts/bluegreen-deploy.sh deploy/scripts/rollback.sh deploy/scripts/release-status.sh              deploy/scripts/request-loop.sh release/deploy/scripts/
          cp deploy/scripts/lib/bluegreen-lib.sh release/deploy/scripts/lib/
          cp deploy/env/staging.env deploy/env/production.env release/deploy/env/
          cp deploy/nginx/nginx.conf release/deploy/nginx/
          cp -r deploy/db/init release/deploy/db/init
          find release/deploy -name '.env' -type f -delete
          printf '%s\n' "$RELEASE_SHA" > release/RELEASE_SHA
          (cd release && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload the release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: release
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Deploy to staging
    needs: [gate, package]
    runs-on: ubuntu-latest
    # Shorter than the 15 minute SSH rule expiry, so the sweeper never revokes a live deploy.
    timeout-minutes: 10
    environment: staging
    permissions:
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_ENV: staging
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: release
      - name: Verify bundle integrity and commit
        run: |
          set -euo pipefail
          (cd release && sha256sum --check --strict SHA256SUMS)
          test "$(cat release/RELEASE_SHA)" = "$RELEASE_SHA"
      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
      - name: Open SSH for this runner only
        id: ssh_open
        env:
          SSH_SG_ID: ${{ vars.SSH_SG_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # Fixed constants, never taken from inputs: tcp, port 22.
          ip="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          octet='(0|[1-9][0-9]{0,2})'
          [[ "$ip" =~ ^${octet}\.${octet}\.${octet}\.${octet}$ ]] || fail "runner address is not a single IPv4 address"
          a="${BASH_REMATCH[1]}"; b="${BASH_REMATCH[2]}"
          for o in "${BASH_REMATCH[@]:1:4}"; do (( o <= 255 )) || fail "runner address octet out of range"; done
          if (( a == 0 || a == 10 || a == 127 || a >= 224 )) \
            || (( a == 169 && b == 254 )) \
            || (( a == 172 && b >= 16 && b <= 31 )) \
            || (( a == 192 && b == 168 )) \
            || (( a == 100 && b >= 64 && b <= 127 )); then
            fail "runner address is not a public IPv4 address"
          fi
          cidr="${ip}/32"
          desc="gha-${GITHUB_RUN_ID}-exp-$(( $(date +%s) + 900 ))"
          created="$(aws ec2 authorize-security-group-ingress \
            --group-id "$SSH_SG_ID" \
            --ip-permissions "[{\"IpProtocol\":\"tcp\",\"FromPort\":22,\"ToPort\":22,\"IpRanges\":[{\"CidrIp\":\"${cidr}\",\"Description\":\"${desc}\"}]}]" \
            --output json)"
          rule_id="$(printf '%s' "$created" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).SecurityGroupRules||[];console.log(r.length===1?r[0].SecurityGroupRuleId:"")})')"
          [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]] || fail "could not read the created rule id"
          echo "rule_id=${rule_id}" >> "$GITHUB_OUTPUT"
          # Read the rule back and check it is exactly what was requested; also fail if the
          # SSH group holds anything other than tcp/22 to a single address.
          aws ec2 describe-security-group-rules --filters "Name=group-id,Values=${SSH_SG_ID}" --output json > "$RUNNER_TEMP/sg-rules.json"
          if ! RULES_FILE="$RUNNER_TEMP/sg-rules.json" EXPECT_ID="$rule_id" EXPECT_CIDR="$cidr" EXPECT_DESC="$desc" node -e '
            const rules = (JSON.parse(require("fs").readFileSync(process.env.RULES_FILE, "utf8")).SecurityGroupRules || []).filter((r) => !r.IsEgress);
            const mine = rules.find((r) => r.SecurityGroupRuleId === process.env.EXPECT_ID);
            const problems = [];
            if (!mine) problems.push("created rule not found");
            else if (mine.IpProtocol !== "tcp" || mine.FromPort !== 22 || mine.ToPort !== 22 || mine.CidrIpv4 !== process.env.EXPECT_CIDR || mine.Description !== process.env.EXPECT_DESC) problems.push("created rule differs from the request");
            for (const r of rules) if (r.IpProtocol !== "tcp" || r.FromPort !== 22 || r.ToPort !== 22 || !/\/32$/.test(r.CidrIpv4 || "")) problems.push("unexpected ingress rule " + r.SecurityGroupRuleId);
            if (problems.length) { console.error(problems.join("; ")); process.exit(1); }
          '; then
            # Clear the saved id only when the revoke worked, so the cleanup step retries otherwise.
            if aws ec2 revoke-security-group-ingress --group-id "$SSH_SG_ID" --security-group-rule-ids "$rule_id"; then
              echo "rule_id=" >> "$GITHUB_OUTPUT"
            fi
            fail "SSH group failed verification; the rule was revoked"
          fi
          echo "Opened tcp/22 for one runner address (rule ${rule_id}), expires in 15 minutes."
      - name: Prepare SSH (pinned host key, no ssh-keyscan)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Upload the release and run the blue/green deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release is not a full SHA"; exit 1; }
          ssh_opts=(-i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15
                    -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts")
          remote="${EC2_USER}@${EC2_HOST}"
          ssh "${ssh_opts[@]}" "$remote" "mkdir -p shopnest/incoming shopnest/logs && rm -rf shopnest/incoming/${RELEASE_SHA}"
          scp -q -r "${ssh_opts[@]}" release "${remote}:shopnest/incoming/${RELEASE_SHA}"
          # The script starts the idle colour, validates /health and /version (must equal the SHA),
          # switches traffic only on success and, if the live check fails after the switch, returns
          # traffic to the previous release by itself (see bg_release in deploy/scripts/lib).
          # Exit 0: deployed. 1: failed, the previous release is serving. 3: failed AND the automatic
          # rollback did not restore a verified release (critical). 255: SSH itself failed.
          rc=0
          ssh "${ssh_opts[@]}" "$remote" "bash shopnest/incoming/${RELEASE_SHA}/deploy/scripts/bluegreen-deploy.sh --env ${DEPLOY_ENV} --sha ${RELEASE_SHA}" || rc=$?
          case "$rc" in
            0) ;;
            3)
              echo "::error::CRITICAL: the deploy failed AND the automatic recovery did not restore a verified release; ${DEPLOY_ENV} may be serving a release that did not verify. Run release-status.sh on the server and read the log now."
              echo "### CRITICAL: deploy failed and recovery failed (exit 3)" >> "$GITHUB_STEP_SUMMARY" ;;
            255)
              echo "::error::SSH to the server failed (exit 255); the deploy did not run to completion."
              echo "### deploy did not run: SSH failed (exit 255)" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::The deploy failed (exit ${rc}); the previous release is serving."
              echo "### deploy failed (exit ${rc}); the previous release is serving" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit "$rc"
      - name: Collect the deployment log
        # Only after SSH was opened; best effort, so a missing log never hides the real failure.
        if: always() && steps.ssh_open.outputs.rule_id != ''
        continue-on-error: true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -q -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "${EC2_USER}@${EC2_HOST}:shopnest/logs/${DEPLOY_ENV}-${RELEASE_SHA}.log" deploy.log
      - name: Upload the deployment log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-log-staging-${{ needs.gate.outputs.sha }}
          path: deploy.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Close SSH ingress
        # Runs on success, failure and cancellation. Revokes by rule id, never by address.
        if: always() && steps.ssh_open.outputs.rule_id != ''
        env:
          SSH_SG_ID: ${{ vars.SSH_SG_ID }}
          RULE_ID: ${{ steps.ssh_open.outputs.rule_id }}
        run: aws ec2 revoke-security-group-ingress --group-id "$SSH_SG_ID" --security-group-rule-ids "$RULE_ID"
      - name: Remove SSH key material
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/sg-rules.json"

  deploy-production:
    name: Deploy to production
    needs: [gate, package, deploy-staging]
    runs-on: ubuntu-latest
    # Shorter than the 15 minute SSH rule expiry, so the sweeper never revokes a live deploy.
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_ENV: production
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: release
      - name: Verify bundle integrity and commit
        run: |
          set -euo pipefail
          (cd release && sha256sum --check --strict SHA256SUMS)
          test "$(cat release/RELEASE_SHA)" = "$RELEASE_SHA"
      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
      - name: Open SSH for this runner only
        id: ssh_open
        env:
          SSH_SG_ID: ${{ vars.SSH_SG_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # Fixed constants, never taken from inputs: tcp, port 22.
          ip="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          octet='(0|[1-9][0-9]{0,2})'
          [[ "$ip" =~ ^${octet}\.${octet}\.${octet}\.${octet}$ ]] || fail "runner address is not a single IPv4 address"
          a="${BASH_REMATCH[1]}"; b="${BASH_REMATCH[2]}"
          for o in "${BASH_REMATCH[@]:1:4}"; do (( o <= 255 )) || fail "runner address octet out of range"; done
          if (( a == 0 || a == 10 || a == 127 || a >= 224 )) \
            || (( a == 169 && b == 254 )) \
            || (( a == 172 && b >= 16 && b <= 31 )) \
            || (( a == 192 && b == 168 )) \
            || (( a == 100 && b >= 64 && b <= 127 )); then
            fail "runner address is not a public IPv4 address"
          fi
          cidr="${ip}/32"
          desc="gha-${GITHUB_RUN_ID}-exp-$(( $(date +%s) + 900 ))"
          created="$(aws ec2 authorize-security-group-ingress \
            --group-id "$SSH_SG_ID" \
            --ip-permissions "[{\"IpProtocol\":\"tcp\",\"FromPort\":22,\"ToPort\":22,\"IpRanges\":[{\"CidrIp\":\"${cidr}\",\"Description\":\"${desc}\"}]}]" \
            --output json)"
          rule_id="$(printf '%s' "$created" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).SecurityGroupRules||[];console.log(r.length===1?r[0].SecurityGroupRuleId:"")})')"
          [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]] || fail "could not read the created rule id"
          echo "rule_id=${rule_id}" >> "$GITHUB_OUTPUT"
          # Read the rule back and check it is exactly what was requested; also fail if the
