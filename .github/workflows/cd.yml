name: CD

# Continuous delivery to STAGING on AWS: runs only after the CI workflow has SUCCEEDED for a push to main.
# Design: docs/AWS_STAGING_INTEGRATION.md.
#
#   package         build the backend image and ONE release bundle (scripts, settings, frontend build) for this exact commit
#   deploy-staging  1. push the image to ECR under an immutable tag and read back its DIGEST
#                   2. run the database migrations in the CodeBuild migrator, inside that very image. If they fail, NOTHING is
#                      deployed (the job stops here). The schema is never reversed automatically.
#                   3. upload the bundle to S3 (this environment's prefix)
#                   4. tell the application instance to deploy it, through Systems Manager (no SSH, no inbound port): it verifies
#                      the bundle's SHA-256 before extracting, pulls the image BY DIGEST, proves the metadata-service isolation,
#                      then runs the blue/green deploy with automatic rollback. Exit codes 0, 1 and 3 come back unchanged.
#
# No credentials are stored: the deploy job exchanges its short-lived GitHub OIDC token for the deploy role's temporary
# credentials. There are no GitHub secrets. It reads these NON-secret variables from the `staging` GitHub Environment (they are
# set separately, with approval; none exists yet):
#   AWS_ROLE_ARN, AWS_REGION, ECR_REPOSITORY, ARTIFACT_BUCKET, MIGRATOR_PROJECT, SSM_DEPLOY_DOCUMENT, STAGING_INSTANCE_ID
#
# STATUS: written and tested offline only (deploy/ci/*.sh and their tests, actionlint); it has NEVER run against AWS. Nothing here
# runs until the repository variable CD_ENABLED is set to "true" (a deliberate, separate step), so merging this file cannot start
# a deployment. Production is NOT deployed by this workflow (no production infrastructure exists): see the last job. Manual
# rollback is the separate rollback.yml workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# No default token permissions: every job declares exactly what it needs.
permissions: {}

jobs:
  gate:
    name: Verify CI result and select release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - name: Select the exact commit CI validated
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::CI commit is not a full SHA"; exit 1; }
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          deploy=true
          if [ "$tip" != "$CI_SHA" ]; then
            deploy=false
            echo "::notice::Skipping: main has moved on since this CI run, so it is not the latest commit."
          fi
          echo "sha=${CI_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release selection"
            echo "- Commit: \`${CI_SHA}\`"
            echo "- CI run: ${CI_RUN_URL}"
            echo "- Deploy: ${deploy}"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package release
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Download the frontend build produced by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-node24
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: frontend-dist
      - name: Build the backend image for this exact commit
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --tag "shopnest-backend:${RELEASE_SHA}" backend
          mkdir -p upload
          docker save "shopnest-backend:${RELEASE_SHA}" | gzip -9 > upload/backend-image.tar.gz
      - name: Build the release bundle (explicit file list; refuses a broken frontend)
        id: bundle
        run: |
          set -euo pipefail
          bash deploy/ci/build-bundle.sh --mode release --sha "$RELEASE_SHA" --frontend-dist frontend-dist --out upload
          echo "sha256=$(cat upload/bundle.sha256)" >> "$GITHUB_OUTPUT"
      - name: Upload the release artifacts for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: upload
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Deploy to staging
    needs: [gate, package]
    runs-on: ubuntu-latest
    # Image push, migrations, upload and the deploy itself (the SSM command is limited to 20 minutes).
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      BUNDLE_SHA256: ${{ needs.package.outputs.bundle_sha256 }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      MIGRATOR_PROJECT: ${{ vars.MIGRATOR_PROJECT }}
      SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Download the release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.sha }}
          path: upload
      - name: Check the settings and the bundle before touching AWS
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REPOSITORY ARTIFACT_BUCKET MIGRATOR_PROJECT SSM_DEPLOY_DOCUMENT STAGING_INSTANCE_ID BUNDLE_SHA256; do
            [ -n "${!name}" ] || { echo "::error::$name is not set (a staging Environment variable, or the package job's output)"; exit 1; }
          done
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the package job did not report a valid bundle hash"; exit 1; }
          # The bundle that is about to be uploaded must be exactly the one the package job built.
          echo "${BUNDLE_SHA256}  upload/bundle.tar.gz" | sha256sum --check --strict
      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Push the image to ECR and read back its digest
        id: image
        run: |
          set -euo pipefail
          bash deploy/ci/push-image.sh --image-tar upload/backend-image.tar.gz --repository "$ECR_REPOSITORY" --sha "$RELEASE_SHA" --region "$AWS_REGION"
      # A failed migration FAILS this step, and every later step is skipped: nothing is deployed.
      - name: Apply the database migrations (CodeBuild migrator, inside the release image)
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          bash deploy/ci/run-codebuild.sh --project "$MIGRATOR_PROJECT" --image-ref "$IMAGE_REF" --release-sha "$RELEASE_SHA" --region "$AWS_REGION"
      - name: Upload the release bundle to S3
        run: |
          set -euo pipefail
          aws s3 cp upload/bundle.tar.gz "s3://${ARTIFACT_BUCKET}/deploy/staging/${RELEASE_SHA}/bundle.tar.gz" --region "$AWS_REGION" --only-show-errors
      - name: Deploy on the instance (Systems Manager, no SSH)
        id: deploy
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -uo pipefail
          rc=0
          bash deploy/ci/run-ssm-command.sh \
            --document "$SSM_DEPLOY_DOCUMENT" --instance "$STAGING_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout 1200 --max-wait 1500 --log-file deploy-log.txt -- \
            "Sha=${RELEASE_SHA}" "ImageRef=${IMAGE_REF}" \
            "BundleKey=deploy/staging/${RELEASE_SHA}/bundle.tar.gz" "BundleSha256=${BUNDLE_SHA256}" || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            1) echo "::error::The deploy failed; the previous release is still serving (exit 1)." ;;
            3) echo "::error::CRITICAL: the deploy failed AND the automatic rollback failed (exit 3). The environment may be serving a release that did not verify." ;;
            *) echo "::error::The deploy result could not be confirmed (exit $rc). Treat it as failed and check the instance." ;;
          esac
          exit "$rc"
      - name: Upload the deployment log
        if: always() && hashFiles('deploy-log.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-log-staging-${{ needs.gate.outputs.sha }}
          path: deploy-log.txt
          retention-days: 30
      - name: Summary
        if: always()
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        run: |
          {
            echo "### Staging deploy"
            echo "- Release: \`${RELEASE_SHA}\`"
            echo "- Image (by digest): \`${IMAGE_REF:-not pushed}\`"
            echo "- Bundle SHA-256: \`${BUNDLE_SHA256}\`"
            echo "- Result code: \`${EXIT_CODE:-not reached}\` (0 deployed; 1 failed, previous release serving; 3 failed and recovery failed; 4 unconfirmed)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Production is deliberately NOT deployed by this workflow: no production infrastructure (two instances, Multi-AZ database,
  # rolling deploy) exists, and a production job here would only invite a half-working deployment. This job writes that down in
  # the run summary and does nothing else. It never binds the `production` GitHub Environment, so it cannot ask anyone to approve
  # a deployment that does not exist.
  production-not-deployed:
    name: Production is not deployed by this workflow
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record that production was not touched
        run: |
          {
            echo "### Production"
            echo "Production is not deployed by this workflow (production CD is not implemented). Nothing was changed there."
          } >> "$GITHUB_STEP_SUMMARY"
