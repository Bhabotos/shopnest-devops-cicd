name: Rollback

# Manual rollback of STAGING to a release that was deployed earlier (assignment Part G), through Systems Manager: no SSH, no inbound
# port, no stored credential. Design: docs/AWS_STAGING_INTEGRATION.md.
#
# It FAILS CLOSED rather than being ignored:
#   - a request for production is refused (production rollback is not implemented: no production infrastructure exists);
#   - a request while the repository variable CD_ENABLED is not "true" is refused, not silently skipped;
#   - a request from any ref other than main is refused.
#
# The rollback itself is deploy/scripts/rollback.sh on the instance, run from a small "carrier" bundle of the CURRENT main tooling
# (scripts and settings only; its S3 key is derived from its own content, so it can never overwrite a release bundle). That script
# refuses a release that is not recorded as deployed, pulls the recorded image DIGEST again if the host lost it, restores the
# recorded frontend files from S3 after verifying their SHA-256, starts the release on the idle colour, requires /health OK and
# /version == the SHA, and only then moves traffic. It NEVER runs migrations, so it NEVER reverses the database schema: a schema
# problem is fixed forward, or by a point-in-time restore.
#
# Non-secret variables read from the `staging` GitHub Environment (set separately, with approval; none exists yet):
#   AWS_ROLE_ARN, AWS_REGION, ARTIFACT_BUCKET, SSM_ROLLBACK_DOCUMENT, STAGING_INSTANCE_ID
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back (only staging is implemented; production is refused)
        type: choice
        required: true
        options: [staging, production]
      sha:
        description: Full 40-character commit SHA of an earlier release (must appear as deployed in the release history)
        type: string
        required: true

# No default token permissions: every job declares exactly what it needs.
permissions: {}

jobs:
  guard:
    name: Refuse what is not allowed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail closed
        env:
          TARGET_ENV: ${{ inputs.environment }}
          CD_ENABLED: ${{ vars.CD_ENABLED }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            echo "::error::Refused: a production rollback is not implemented (no production infrastructure exists). Nothing was changed."
            exit 1
          fi
          [ "$TARGET_ENV" = "staging" ] || { echo "::error::Refused: environment must be staging."; exit 1; }
          if [ "$CD_ENABLED" != "true" ]; then
            echo "::error::Refused: CD is disabled (CD_ENABLED is not true). A rollback request is refused, never silently ignored."
            exit 1
          fi
          [ "$GIT_REF" = "refs/heads/main" ] || { echo "::error::Refused: run this workflow from main only (ref: $GIT_REF)."; exit 1; }

  validate:
    name: Validate the rollback request
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check the inputs and the commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase commit SHA"; exit 1; }
          # The target must be a commit of this repository that is an ancestor of (or equal to) main.
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${GITHUB_SHA}" --jq .status)"
          case "$status" in
            identical | ahead) ;;
            *) echo "::error::${TARGET_SHA} is not an ancestor of main (compare status: ${status})"; exit 1 ;;
          esac
          {
            echo "### Rollback request"
            echo "- Environment: \`staging\`"
            echo "- Target release: \`${TARGET_SHA}\`"
            echo "- Requested by: ${GITHUB_ACTOR}"
            echo "- Tooling from main at \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Roll back staging
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      # The same group as cd.yml, so a deploy and a rollback never overlap.
      group: deploy-staging
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      SSM_ROLLBACK_DOCUMENT: ${{ vars.SSM_ROLLBACK_DOCUMENT }}
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the settings
        run: |
          set -euo pipefail
          for name in AWS_REGION ARTIFACT_BUCKET SSM_ROLLBACK_DOCUMENT STAGING_INSTANCE_ID; do
            [ -n "${!name}" ] || { echo "::error::$name is not set (a staging Environment variable)"; exit 1; }
          done
      - name: Build the carrier bundle (rollback tooling from main; no frontend, no image)
        id: carrier
        run: |
          set -euo pipefail
          bash deploy/ci/build-bundle.sh --mode carrier --sha "$GITHUB_SHA" --out carrier
          hash="$(cat carrier/bundle.sha256)"
          # The carrier's S3 key is derived from its own content: it can never overwrite a release bundle.
          echo "sha256=${hash}" >> "$GITHUB_OUTPUT"
          echo "id=${hash:0:40}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Upload the carrier bundle to S3
        env:
          CARRIER_ID: ${{ steps.carrier.outputs.id }}
        run: |
          set -euo pipefail
          aws s3 cp carrier/bundle.tar.gz "s3://${ARTIFACT_BUCKET}/deploy/staging/${CARRIER_ID}/bundle.tar.gz" --region "$AWS_REGION" --only-show-errors
      - name: Roll back on the instance (Systems Manager, no SSH, no migrations)
        id: rollback
        env:
          CARRIER_ID: ${{ steps.carrier.outputs.id }}
          CARRIER_SHA256: ${{ steps.carrier.outputs.sha256 }}
        run: |
          set -uo pipefail
          rc=0
          bash deploy/ci/run-ssm-command.sh \
            --document "$SSM_ROLLBACK_DOCUMENT" --instance "$STAGING_INSTANCE_ID" --region "$AWS_REGION" \
            --timeout 1200 --max-wait 1500 --log-file rollback-log.txt -- \
            "TargetSha=${TARGET_SHA}" "CarrierSha=${CARRIER_ID}" \
            "CarrierBundleKey=deploy/staging/${CARRIER_ID}/bundle.tar.gz" "CarrierBundleSha256=${CARRIER_SHA256}" || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            1) echo "::error::The rollback failed; the live release is unchanged or was restored (exit 1)." ;;
            3) echo "::error::CRITICAL: the rollback failed AND the recovery failed (exit 3). The environment may be serving a release that did not verify." ;;
            *) echo "::error::The rollback result could not be confirmed (exit $rc). Treat it as failed and check the instance." ;;
          esac
          exit "$rc"
      - name: Upload the rollback log
        if: always() && hashFiles('rollback-log.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollback-log-staging-${{ github.run_id }}
          path: rollback-log.txt
          retention-days: 30
      - name: Summary
        if: always()
        env:
          EXIT_CODE: ${{ steps.rollback.outputs.exit_code }}
        run: |
          {
            echo "### Staging rollback"
            echo "- Target release: \`${TARGET_SHA}\`"
            echo "- Result code: \`${EXIT_CODE:-not reached}\` (0 rolled back; 1 failed, release unchanged or restored; 3 failed and recovery failed; 4 unconfirmed)"
            echo "- The database schema was NOT changed: a rollback never runs migrations."
          } >> "$GITHUB_STEP_SUMMARY"
