name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repository. Each job repeats this explicitly.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-node${{ matrix.node }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: backend
    services:
      # Disposable database that lives only for this job, on the runner. Trust authentication
      # keeps any password out of the repository. The database name ends in "_test" and the host
      # is loopback, as backend/test/helpers/test-db.js requires.
      postgres:
        image: postgres:16.16-alpine3.24@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_DB: shopnest_test
          POSTGRES_USER: shopnest_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # TCP check on purpose: during first-start initialisation the image's temporary server
        # listens on the Unix socket only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U shopnest_test -d shopnest_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://shopnest_test@127.0.0.1:5432/shopnest_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (unit and PostgreSQL integration)
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results.json
      - name: Fail if any test was skipped
        # The integration tests skip themselves when TEST_DATABASE_URL is unset. Make that a
        # failure here, so a misconfigured job can never pass by silently skipping them.
        run: |
          node -e "
          const r = JSON.parse(require('fs').readFileSync('test-results.json', 'utf8'));
          if (r.numPendingTests > 0 || r.numTodoTests > 0) {
            console.error('Skipped or todo tests found: ' + r.numPendingTests + ' skipped, ' + r.numTodoTests + ' todo');
            process.exit(1);
          }
          console.log(r.numPassedTests + ' tests passed, none skipped');
          "

  backend-image:
    name: Backend Docker image
    # Build only after the backend tests pass on both Node versions.
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag shopnest-backend:ci backend

  # PROPOSED NEW JOB for .github/workflows/ci.yml (appended under `jobs:`). It does not change the
  # five existing jobs. It becomes a required check only if the user approves a branch-protection change.
  deploy-scripts:
    name: Deploy scripts and Compose
    runs-on: ubuntu-latest
    # The offline suites (blue/green and the metadata guard) run several hundred checks, each starting shell processes: on a
    # slow machine they took several minutes. The margin is deliberate; the runner's real time is not known yet.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          set -euo pipefail
          find deploy -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        # ShellCheck is preinstalled on ubuntu-latest; its version is printed so the run records it.
        run: |
          shellcheck --version
          find deploy -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
      - name: Offline blue/green tests (fake Docker, no containers)
        run: bash deploy/tests/bluegreen-logic.test.sh
      - name: Offline metadata-guard tests (fake iptables and Docker, no root, no containers)
        run: bash deploy/tests/imds-guard.test.sh
      - name: Offline lab-mode tests (GHCR digests, generated passwords, loopback staging, broken release never takes traffic; fake Docker, no containers)
        run: bash deploy/tests/lab-mode.test.sh
      - name: Environment files agree with the metadata guard (static)
        run: |
          set -euo pipefail
          for env_name in staging production; do
            bash deploy/host/imds-guard.sh validate "deploy/env/${env_name}.env"
          done
      - name: Production Compose (AWS mode) matches the security architecture
        env:
          # Throwaway placeholders that exist only for this step; none is a real value or a secret.
          ENV_DIR: /tmp/shopnest-ci
          HTTP_PORT: "18081"
          DB_HOST: db.example.internal
          DB_NAME: shopnest
          AWS_REGION: ap-south-1
          DB_APP_SECRET_ID: shopnest/ci/db-app
        run: |
          set -euo pipefail
          # The container network settings have ONE source (deploy/env/<env>.env): Compose reads them from there, so does the guard.
          set -a
          # shellcheck disable=SC1090
          . <(grep -E '^(EDGE_|NGINX_IP|BACKEND_)' deploy/env/staging.env)
          set +a
          docker compose -p ci -f deploy/docker-compose.prod.yml config --format json > compose-rds.json
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const c = JSON.parse(fs.readFileSync("compose-rds.json", "utf8"));
            const bad = [];
            const e = process.env;

            const names = Object.keys(c.services).sort().join();
            if (names !== "backend-blue,backend-green,nginx") bad.push("unexpected services (migrate and seed run in CodeBuild, never on the instance): " + names);
            const published = Object.entries(c.services).filter(([, s]) => (s.ports || []).length).map(([n]) => n);
            if (published.join() !== "nginx") bad.push("only nginx may publish a port, found: " + published.join());

            // No database container, no password, and no way to name the owner or master credentials.
            const text = JSON.stringify(c);
            if (/"image":"postgres/.test(text)) bad.push("a postgres image is defined: the database is RDS, not a container");
            if (text.includes("DATABASE_URL")) bad.push("DATABASE_URL must not appear in AWS mode (it carries a password)");
            if (/OWNER|MASTER/i.test(text)) bad.push("the AWS Compose configuration must not mention the owner or master credentials");
            if (Object.keys(c.volumes || {}).length) bad.push("no named volume is expected, found: " + Object.keys(c.volumes).join());

            // One EXTERNAL network with the fixed name from the settings file.
            const edge = c.networks.edge;
            if (Object.keys(c.networks).join() !== "edge") bad.push("the only network must be edge, found: " + Object.keys(c.networks).join());
            if (!edge || edge.external !== true || edge.name !== e.EDGE_NETWORK) bad.push("edge must be external and named " + e.EDGE_NETWORK);

            // Every container: no capabilities (this also removes NET_RAW, so no address spoofing) and no privilege gain.
            for (const [name, s] of Object.entries(c.services)) {
              if (!(s.cap_drop || []).includes("ALL")) bad.push(name + " must drop all capabilities (cap_drop: [ALL])");
              if (!(s.security_opt || []).includes("no-new-privileges:true")) bad.push(name + " must set no-new-privileges");
              if (s.privileged || (s.cap_add || []).length) bad.push(name + " must not be privileged or add capabilities");
              if (s.network_mode) bad.push(name + " must not set network_mode (it would bypass the guarded network)");
            }

            // Fixed addresses, equal to the settings file, all different.
            const ip = (n) => c.services[n].networks.edge.ipv4_address;
            const addresses = { "backend-blue": e.BACKEND_BLUE_IP, "backend-green": e.BACKEND_GREEN_IP, nginx: e.NGINX_IP };
            for (const [n, want] of Object.entries(addresses)) if (ip(n) !== want) bad.push(n + " must have the fixed address " + want + ", has " + ip(n));
            if (new Set(Object.values(addresses)).size !== 3) bad.push("blue, green and nginx must have three different addresses");

            // The backends: the pinned CA inside the image, no host mount, the app secret only, no credentials.
            for (const n of ["backend-blue", "backend-green"]) {
              const s = c.services[n];
              const env = s.environment || {};
              if (Object.keys(env).some((k) => /PASSWORD|SECRET_KEY|TOKEN/.test(k))) bad.push(n + " passes a credential in its environment");
              if (env.DB_SSL_CA_FILE !== "/app/certs/rds-global-bundle.pem") bad.push(n + " must verify the database certificate against the CA bundle inside the image");
              if (!env.DB_SECRET_ID) bad.push(n + " needs DB_SECRET_ID (the db-app secret in Secrets Manager)");
              if ((s.volumes || []).length) bad.push(n + " must not mount anything from the host");
            }

            // nginx only reads its configuration and the frontend files.
            for (const v of c.services.nginx.volumes || []) if (v.read_only !== true) bad.push("nginx must mount " + v.target + " read-only");

            // The firewall rules must name exactly the two backend addresses (and never nginx).
            const rules = execFileSync("bash", ["deploy/host/imds-guard.sh", "render", "deploy/env/staging.env"], { encoding: "utf8" });
            const allowed = [...rules.matchAll(/-s ([0-9.]+)\/32 -d 169\.254\.169\.254\/32 -j ACCEPT/g)].map((m) => m[1]).sort().join();
            if (allowed !== [e.BACKEND_BLUE_IP, e.BACKEND_GREEN_IP].sort().join()) bad.push("the guard must allow exactly the backend addresses to reach the metadata service, allows: " + allowed);
            if (rules.includes(e.NGINX_IP + "/32")) bad.push("the guard must never allow nginx");
            if (!/-d 169\.254\.169\.254\/32 -j DROP/.test(rules)) bad.push("the guard must drop every other container");

            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log("AWS-mode compose ok: three services, external fixed-address network, no capabilities, no database container, no credential, firewall allows exactly the two backends");
          '
      - name: Local-database Compose (rehearsal mode) is separate from the AWS networking
        env:
          # Throwaway placeholders that exist only for this step; no real secret is involved.
          ENV_DIR: /tmp/shopnest-ci
          HTTP_PORT: "18081"
          POSTGRES_PASSWORD: ci0placeholder0aaaa
          DB_OWNER_PASSWORD: ci0placeholder0bbbb
          DB_APP_PASSWORD: ci0placeholder0cccc
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          . <(grep -E '^(EDGE_|NGINX_IP|BACKEND_)' deploy/env/staging.env)
          set +a
          docker compose -p ci -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local-db.yml config --format json > compose-local.json
          node -e '
            const c = JSON.parse(require("fs").readFileSync("compose-local.json", "utf8"));
            const bad = [];
            const names = Object.keys(c.services).sort().join();
            if (names !== "backend-blue,backend-green,db,migrate,nginx,seed") bad.push("unexpected services: " + names);
            const published = Object.entries(c.services).filter(([, s]) => (s.ports || []).length).map(([n]) => n);
            if (published.join() !== "nginx") bad.push("only nginx may publish a port, found: " + published.join());
            if (!c.networks.internal || c.networks.internal.internal !== true) bad.push("the internal network must be internal: true");
            if (!c.networks.edge || c.networks.edge.external) bad.push("the rehearsal must use an ordinary edge network, never the external AWS one");
            if (Object.keys(c.services.db.networks || {}).join() !== "internal") bad.push("db must be on the internal network only");
            for (const [name, s] of Object.entries(c.services)) {
              for (const [net, cfg] of Object.entries(s.networks || {})) {
                if (cfg && cfg.ipv4_address) bad.push(name + " has a fixed address on " + net + ": the rehearsal must not use the AWS addressing");
              }
            }
            for (const n of ["backend-blue", "backend-green"]) {
              const env = c.services[n].environment || {};
              if (!env.DATABASE_URL) bad.push(n + " needs DATABASE_URL in local mode");
              if (env.DB_HOST || env.DB_SECRET_ID || env.DB_SSL_CA_FILE) bad.push(n + " must have the RDS settings empty in local mode (the backend refuses both together)");
            }
            for (const n of ["migrate", "seed"]) {
              if (Object.keys(c.services[n].networks || {}).join() !== "internal") bad.push(n + " must be on the internal network only");
            }
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log("local-database compose ok: db and the one-shot jobs are internal-only, the network is ordinary, no AWS addressing");
          '
      - name: The rehearsal-only settings and the test database stay out of the release path
        run: |
          set -euo pipefail
          # Comment lines are ignored: a comment may explain what the rehearsal file is for, but no setting may use it.
          matches="$(grep -rnE --exclude=ci.yml 'BG_ALLOW_LOOSE_SECRETS|BG_LOCAL_DB|docker-compose\.local-db' .github deploy/env deploy/docker-compose.prod.yml | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::the rehearsal-only settings (BG_ALLOW_LOOSE_SECRETS, BG_LOCAL_DB, the local-database Compose file) must not be used by workflows, env files or the production Compose file"; exit 1
          fi
          if grep -rnE --exclude=ci.yml 'docker-compose\.(test|dev)\.yml' .github deploy/scripts/lib deploy/scripts/bluegreen-deploy.sh deploy/scripts/rollback.sh; then
            echo "::error::the deploy path must not reference the dev or test Compose files"; exit 1
          fi
      - name: Offline CI-helper tests (bundle, image push, migrator, Systems Manager runner; fake aws and docker)
        run: bash deploy/tests/ci-helpers.test.sh
      - name: Host wrappers, SSH entry point and host setup (offline tests of validation, the sudoers rule and key binding; no root, no network)
        run: bash deploy/tests/host-wrapper.test.sh
      - name: Request-loop evidence tool counts failures, timeouts and latency correctly (offline; throwaway loopback server)
        run: bash deploy/tests/request-loop.test.sh
      - name: SSH deploy through the SSM tunnel and the pinned plugin installer (offline; fake aws, ssh and curl)
        # Proves strict host key checking against the pinned key, the pre-flight, the exit codes, and that the tunnel, the SSM session and
        # the key are cleaned up on every path. It does not prove AWS, sshd or the instance: that needs the first real run.
        run: bash deploy/tests/ssh-deploy.test.sh
      - name: Lab Terraform follows the approved minimal architecture (static; reads infra/lab only)
        run: bash deploy/tests/lab.test.sh
      - name: Lab Compose (a PostgreSQL container per environment, internal only, only nginx publishes a port)
        env:
          # Throwaway placeholders that exist only for this step; no real secret is involved.
          ENV_DIR: /tmp/shopnest-ci
          POSTGRES_PASSWORD: ci0placeholder0aaaa
          DB_OWNER_PASSWORD: ci0placeholder0bbbb
          DB_APP_PASSWORD: ci0placeholder0cccc
        run: |
          set -euo pipefail
          for env_name in staging production; do
            set -a
            # shellcheck disable=SC1090
            . <(grep -E '^(EDGE_|NGINX_IP|BACKEND_|HTTP_PORT)' "deploy/env/${env_name}.env")
            set +a
            # The deploy script binds production to all addresses and staging to loopback (bg_init, lab mode).
            if [ "$env_name" = production ]; then bind=0.0.0.0; else bind=127.0.0.1; fi
            HTTP_BIND="$bind" docker compose -p "lab-${env_name}" -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local-db.yml config --format json > "compose-lab-${env_name}.json"
            ENV_NAME="$env_name" BIND="$bind" node -e '
              const c = JSON.parse(require("fs").readFileSync("compose-lab-" + process.env.ENV_NAME + ".json", "utf8"));
              const bad = [];
              const names = Object.keys(c.services).sort().join();
              if (names !== "backend-blue,backend-green,db,migrate,nginx,seed") bad.push("unexpected services: " + names);
              const published = Object.entries(c.services).filter(([, s]) => (s.ports || []).length).map(([n]) => n);
              if (published.join() !== "nginx") bad.push("only nginx may publish a port, found: " + published.join());
              const port = c.services.nginx.ports[0];
              if (port.host_ip !== process.env.BIND) bad.push("nginx must be bound to " + process.env.BIND + ", is " + port.host_ip);
              if (String(port.published) !== (process.env.ENV_NAME === "production" ? "80" : "8081")) bad.push("unexpected published port " + port.published);
              if (!c.networks.internal || c.networks.internal.internal !== true) bad.push("the internal network must be internal: true");
              if (Object.keys(c.services.db.networks || {}).join() !== "internal") bad.push("db must be on the internal network only");
              if ((c.services.db.ports || []).length) bad.push("db must publish no port");
              for (const [name, s] of Object.entries(c.services)) {
                for (const cfg of Object.values(s.networks || {})) if (cfg && cfg.ipv4_address) bad.push(name + " has a fixed address");
              }
              if (bad.length) { console.error(bad.join(" | ")); process.exit(1); }
              console.log(process.env.ENV_NAME + " lab compose ok: database internal-only and unpublished, only nginx publishes (" + process.env.BIND + ")");
            '
          done
      - name: ShellCheck of the host and CI scripts that handle keys and run as root (warning level, nothing skipped)
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck --severity=warning deploy/host/*.sh deploy/ci/ssh-deploy.sh deploy/ci/install-ssm-plugin.sh deploy/tests/host-wrapper.test.sh deploy/tests/ssh-deploy.test.sh
      - name: SSM document scripts pass ShellCheck (static; extracted from the Terraform source)
        # ShellCheck is preinstalled on ubuntu-latest, as for the "ShellCheck" step above.
        run: bash deploy/tests/ssm-scripts.test.sh
      - name: Install PyYAML (pinned, in a virtual environment) for the workflow checker
        # The workflow checker parses YAML with Python. A virtual environment is used because the runner's system Python refuses
        # `pip install` into itself; putting it first on the PATH makes `python3` the one that has PyYAML.
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/yaml-venv"
          "$RUNNER_TEMP/yaml-venv/bin/python" -m pip install --quiet --disable-pip-version-check "pyyaml==6.0.3"
          echo "$RUNNER_TEMP/yaml-venv/bin" >> "$GITHUB_PATH"
      - name: Deployment workflows use SSH only through the pinned SSM tunnel, keep one secret per environment and fail closed (static)
        # Replaces the SSM-only check: SSH is back, but only through deploy/ci/ssh-deploy.sh, with host key checking never weakened.
        run: bash deploy/tests/workflows.test.sh
