# Nginx for one environment. Mounted as /etc/nginx/conf.d/default.conf (so it sits inside http{}).
# A release goes live by replacing upstream/active.conf and reloading (graceful: in-flight requests
# finish on the old workers). The scripts run `nginx -t` first. That ONE file switches both tiers:
#   upstream backend_active { server backend-<colour>:3000; }
#   map $host $frontend_root { default /srv/frontend/releases/<release sha>; }
include /etc/nginx/upstream/active.conf;

server {
  listen 8080;
  server_name _;
  root $frontend_root;
  index index.html;

  location /api/ {
    proxy_pass http://backend_active;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  # "/api" without a trailing slash is not an API route: answer in the API's JSON error shape.
  location = /api {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"Route not found"}}';
  }

  # Readiness through the public origin. A dead backend gives 502/504 here, never the SPA page.
  location = /health {
    proxy_pass http://backend_active;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
  }

  # /version stays internal (see the loopback server below).
  location = /version {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app fallback; index.html itself must never be cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

# Internal probes for the deploy scripts. Loopback inside the container only; not published.
# /version here reports the commit of whichever colour currently receives traffic.
server {
  listen 127.0.0.1:8081;
  server_name _;
  access_log off;

  location = /health {
    proxy_pass http://backend_active;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location = /version {
    proxy_pass http://backend_active;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location / {
    return 404;
  }
}
