# Blue/green stack for ONE environment (staging or production), for AWS. The database is the private RDS PostgreSQL
# instance, not a container, and NO container here can reach the owner or master credentials: migrations and the
# role bootstrap run in CodeBuild, outside this host. The deploy scripts run this file as one Compose project per
# environment on that environment's application instance.
#
# Never run a plain `docker compose up` here: it would start BOTH colours. The scripts always name the services
# they want (nginx, backend-blue or backend-green).
#
# The backend reaches RDS over TLS with the server certificate verified against the pinned RDS CA bundle baked into
# the image (backend/certs), and reads its database user and password (db-app only) from AWS Secrets Manager with the
# instance role. No password is ever passed to a container. Variables come from the scripts' environment (see
# deploy/scripts/lib/bluegreen-lib.sh); none of them is secret:
#   ENV_DIR, HTTP_PORT, BLUE_TAG, GREEN_TAG, APP_VERSION, LOG_LEVEL
#   DB_HOST, DB_PORT, DB_NAME, AWS_REGION, DB_APP_SECRET_ID      (from <env>/runtime.env)
#   EDGE_NETWORK, NGINX_IP, BACKEND_BLUE_IP, BACKEND_GREEN_IP    (from deploy/env/<env>.env)
#
# The network is EXTERNAL and has fixed addresses on purpose: the host firewall (deploy/host/imds-guard.sh) lets only
# the two backend addresses reach the EC2 metadata service. A laptop rehearsal layers a local-database file on top
# (see the rehearsal-only files in this directory); it never uses this networking.

x-hardening: &hardening
  # No Linux capabilities (this also removes NET_RAW, so a container cannot forge another container's address) and no
  # privilege gain. Neither nginx (unprivileged, port 8080) nor the backend (user node) needs any.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-backend: &backend
  <<: *hardening
  environment: &backend-env
    DB_HOST: ${DB_HOST:-}
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${DB_NAME:-}
    DB_SECRET_ID: ${DB_APP_SECRET_ID:-}
    AWS_REGION: ${AWS_REGION:-}
    DB_SSL_CA_FILE: /app/certs/rds-global-bundle.pem
    APP_VERSION: ${APP_VERSION:-release}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  restart: unless-stopped
  stop_grace_period: 20s

services:
  backend-blue:
    <<: *backend
    image: shopnest-backend:${BLUE_TAG:-none}
    environment:
      <<: *backend-env
      GIT_SHA: ${BLUE_TAG:-none}
    networks:
      edge:
        ipv4_address: ${BACKEND_BLUE_IP:?BACKEND_BLUE_IP is required}

  backend-green:
    <<: *backend
    image: shopnest-backend:${GREEN_TAG:-none}
    environment:
      <<: *backend-env
      GIT_SHA: ${GREEN_TAG:-none}
    networks:
      edge:
        ipv4_address: ${BACKEND_GREEN_IP:?BACKEND_GREEN_IP is required}

  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.29.8-alpine3.23@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:?HTTP_PORT is required}:8080"
    volumes:
      # All stable host paths under the environment directory.
      # Directories (not single files), so atomic renames made by the scripts are visible inside.
      - ${ENV_DIR:?ENV_DIR is required}/nginx/conf:/etc/nginx/conf.d:ro
      - ${ENV_DIR}/nginx/upstream:/etc/nginx/upstream:ro
      - ${ENV_DIR}/frontend:/srv/frontend:ro
    networks:
      edge:
        ipv4_address: ${NGINX_IP:?NGINX_IP is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  # Created once by deploy/host/imds-guard.sh (ensure-network) with the fixed subnet; Compose never creates or deletes it.
  edge:
    external: true
    name: ${EDGE_NETWORK:?EDGE_NETWORK is required}
