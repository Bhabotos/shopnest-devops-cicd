# LOCAL REHEARSAL ONLY (BG_LOCAL_DB=1; the lab instance's separate use of this file is described below). Layered on top of docker-compose.prod.yml by the deploy scripts, so the
# blue/green logic can be rehearsed on a laptop that has no RDS and no metadata service. It:
#   - puts a PostgreSQL CONTAINER back (roles from deploy/db/init/01-roles.sh) and points the backends at it with DATABASE_URL;
#   - defines the migrate and seed one-shot jobs, which the AWS file does NOT have (on AWS they run in CodeBuild);
#   - replaces the external, fixed-address "edge" network with an ordinary bridge network: the laptop's networking is
#     kept entirely separate from the AWS networking, and nothing here touches the host firewall.
# Rehearsal mode (BG_LOCAL_DB=1) is refused for staging and production: see bg_init in deploy/scripts/lib/bluegreen-lib.sh.
# LAB mode (BG_LAB=1, the infra/lab instance) layers this same file on top of docker-compose.prod.yml for staging and production: each
# environment is its own Compose project with its own PostgreSQL container on the internal network (no published port). In lab mode
# bg_init also generates the passwords and sets HTTP_BIND (staging: loopback only; production: all addresses).
#
# Extra variables (from the server-side secrets.env of the rehearsal):
#   POSTGRES_PASSWORD, DB_OWNER_PASSWORD, DB_APP_PASSWORD   (letters and digits only, so they fit in a URL)

x-local-backend-env: &local-backend-env
  DATABASE_URL: postgres://shopnest_app:${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}@db:5432/shopnest
  # The RDS settings must be EMPTY in this mode: the backend refuses DATABASE_URL together with them.
  DB_HOST: ""
  DB_NAME: ""
  DB_SECRET_ID: ""
  DB_SSL_CA_FILE: ""

x-local-owner-env: &local-owner-env
  DATABASE_URL: postgres://shopnest_owner:${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is required}@db:5432/shopnest

services:
  db:
    image: postgres:16.16-alpine3.24@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: shopnest
      POSTGRES_USER: shopnest_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # A STABLE host path (staged by the scripts from the bundle), never a path inside the release
      # bundle: a mount that changes with every release makes Compose recreate this container.
      - ${ENV_DIR:?ENV_DIR is required}/db-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    # No "ports:" on purpose: the database is reachable only on the internal network.
    restart: unless-stopped
    healthcheck:
      # TCP on purpose: the image's init-time server listens on the Unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shopnest_admin -d shopnest"]
      interval: 10s
      timeout: 3s
      retries: 20

  # One-shot jobs, started explicitly by the scripts with `run --rm --no-deps`. Migrations run as the owner role
  # BEFORE traffic moves, so they must stay backward compatible with the release that is still live.
  migrate:
    image: shopnest-backend:${MIGRATE_TAG:-none}
    command: ["node", "scripts/migrate.js"]
    environment: *local-owner-env
    networks: [internal]
    restart: "no"

  # Demo catalogue, only when an operator asks for it with --seed (see bluegreen-deploy.sh).
  seed:
    image: shopnest-backend:${MIGRATE_TAG:-none}
    command: ["node", "scripts/seed.js"]
    environment:
      <<: *local-owner-env
      NODE_ENV: ${SEED_NODE_ENV:-development}
      ALLOW_PRODUCTION_SEED: ${ALLOW_PRODUCTION_SEED:-}
    networks: [internal]
    restart: "no"

  backend-blue:
    environment: *local-backend-env
    networks: !override [internal, edge]
    depends_on:
      db:
        condition: service_healthy

  backend-green:
    environment: *local-backend-env
    networks: !override [internal, edge]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    networks: !override [edge]

networks:
  # Backend database access only; no route to the outside.
  internal:
    internal: true
  # An ordinary bridge network for the rehearsal: no fixed addresses, no firewall rules.
  edge: !override {}

volumes:
  pgdata:
