# Disposable database for the backend integration tests. Separate from the dev stack.
#   export TEST_DB_PASSWORD=<local value>
#   docker compose -f deploy/docker-compose.test.yml up -d --wait
#   TEST_DATABASE_URL=postgres://shopnest_test:$TEST_DB_PASSWORD@127.0.0.1:55432/shopnest_test npm test --prefix backend
#   docker compose -f deploy/docker-compose.test.yml down
# The database name must end in "_test"; the test helper refuses anything else. Data lives in
# memory (tmpfs) and is gone when the container stops.
name: shopnest-test

services:
  db-test:
    image: postgres:16.16-alpine3.24@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: shopnest_test
      POSTGRES_USER: shopnest_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?set TEST_DB_PASSWORD in your shell}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_DB_HOST_PORT:-55432}:5432"
    healthcheck:
      # TCP, like the app: the image's init-time server listens on the Unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shopnest_test -d shopnest_test"]
      interval: 3s
      timeout: 3s
      retries: 20
